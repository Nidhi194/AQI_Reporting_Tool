<!DOCTYPE html>
<html>
<head>
    <title>Login System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #06b6d4, #22c55e);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3a8a;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #475569;
            margin-bottom: 25px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #f8fafc;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.25);
        }

        p {
            text-align: center;
            margin-top: 18px;
            color: #475569;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        #result {
            text-align: center;
            margin-top: 18px;
            font-size: 16px;
            color: #dc2626;
            min-height: 24px;
        }

        .icon {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        #loginForm, #registerForm {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 20px;
            }

            h2 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">🌿</div>
    <h2 id="title">Login</h2>
    <div class="subtitle">Air Monitoring Management System</div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <input id="loginEmail" type="email" placeholder="Enter your email">
        <input id="loginPassword" type="password" placeholder="Enter your password">

        <button onclick="login()">Login</button>

        <p>
            New user?
            <a href="#" onclick="showRegister(); return false;">Register here</a>
        </p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">
        <input id="regEmail" type="email" placeholder="Enter your email">
        <input id="regPassword" type="password" placeholder="Create password">
        <input id="confirmPassword" type="password" placeholder="Confirm password">

        <select id="role">
            <option value="">Select Role</option>
            <option value="Monitoring Agency">Monitoring Agency</option>
            <option value="Industry">Industry</option>
        </select>

        <button onclick="register()">Register</button>

        <p>
            Already have an account?
            <a href="#" onclick="showLogin(); return false;">Login here</a>
        </p>
    </div>

    <h3 id="result"></h3>
</div>

<script>
// SWITCH FORMS
function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
    document.getElementById("title").innerText = "Register";
    document.getElementById("result").innerText = "";
}

function showLogin() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("title").innerText = "Login";
    document.getElementById("result").innerText = "";
}

// REGISTER
async function register() {
    let email = document.getElementById("regEmail").value.trim();
    let password = document.getElementById("regPassword").value.trim();
    let confirmPassword = document.getElementById("confirmPassword").value.trim();
    let role = document.getElementById("role").value;

    if (!email || !password || !confirmPassword || !role) {
        alert("Please fill all fields");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    try {
        let res = await fetch("http://localhost:3000/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password, role })
        });

        let data = await res.json();

        if (data.error) {
            document.getElementById("result").innerText = data.error;
        } else {
            document.getElementById("result").style.color = "#16a34a";
            document.getElementById("result").innerText = data.message;
            alert(data.message);

            document.getElementById("regEmail").value = "";
            document.getElementById("regPassword").value = "";
            document.getElementById("confirmPassword").value = "";
            document.getElementById("role").value = "";

            showLogin();
        }
    } catch (error) {
        console.log(error);
        document.getElementById("result").style.color = "#dc2626";
        document.getElementById("result").innerText = "Server connection error";
    }
}

// LOGIN
async function login() {
    let email = document.getElementById("loginEmail").value.trim();
    let password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
        document.getElementById("result").style.color = "#dc2626";
        document.getElementById("result").innerText = "Please enter email and password";
        return;
    }

    try {
        let res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        let data = await res.json();

        if (data.success) {
            localStorage.setItem("userEmail", data.email);

            if (data.role === "Industry") {
                window.location.href = "industry.html";
            } else if (data.role === "Monitoring Agency") {
                window.location.href = "agency.html";
            } else {
                document.getElementById("result").style.color = "#dc2626";
                document.getElementById("result").innerText = "Unknown role";
            }
        } else {
            document.getElementById("result").style.color = "#dc2626";
            document.getElementById("result").innerText = data.error || "Invalid login";
        }
    } catch (error) {
        console.log(error);
        document.getElementById("result").style.color = "#dc2626";
        document.getElementById("result").innerText = "Server connection error";
    }
}
</script>

</body>
</html>
