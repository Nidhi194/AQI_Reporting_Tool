<!DOCTYPE html>
<html>
<head>
    <title>Login System</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            background: linear-gradient(90deg, #153a73 0%, #1d4f97 45%, #9eb6d3 100%);
        }

        .main-wrapper {
            width: 100%;
            max-width: 1420px;
            min-height: 720px;
            display: flex;
            border-radius: 16px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .left-panel {
            width: 52%;
            background: linear-gradient(180deg, #123f84 0%, #1d4f97 100%);
            color: white;
            padding: 70px 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            margin: 0 0 14px 0;
            font-size: 56px;
            font-weight: 700;
            line-height: 1.1;
        }

        .left-panel .tagline {
            font-size: 22px;
            line-height: 1.5;
            margin-bottom: 34px;
            color: rgba(255, 255, 255, 0.95);
        }

        .feature-list {
            margin: 0;
            padding-left: 28px;
        }

        .feature-list li {
            font-size: 21px;
            line-height: 1.8;
            margin-bottom: 6px;
        }

        .right-panel {
            width: 48%;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 32px;
        }

        .form-box {
            width: 100%;
            max-width: 620px;
        }

        h2 {
            margin: 0 0 28px 0;
            font-size: 54px;
            color: #0b458c;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 19px;
            color: #4d6580;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            height: 64px;
            border: 1.5px solid #d4dde7;
            border-radius: 16px;
            padding: 0 18px;
            font-size: 18px;
            color: #334155;
            background: #ffffff;
            outline: none;
            transition: 0.2s ease;
        }

        input::placeholder {
            color: #7b8794;
        }

        input:focus,
        select:focus {
            border-color: #0b458c;
            box-shadow: 0 0 0 3px rgba(11, 69, 140, 0.12);
        }

        button {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 14px;
            margin-top: 18px;
            background: #123f84;
            color: white;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: #0f376f;
        }

        p {
            text-align: center;
            margin-top: 26px;
            font-size: 18px;
            color: #5f7387;
        }

        a {
            color: #0b458c;
            font-weight: 700;
            text-decoration: underline;
        }

        #result {
            text-align: center;
            margin-top: 18px;
            min-height: 28px;
            font-size: 18px;
            font-weight: 600;
            color: #dc2626;
        }

        .icon {
            display: none;
        }

        #loginForm,
        #registerForm {
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1100px) {
            .main-wrapper {
                flex-direction: column;
                min-height: auto;
            }

            .left-panel,
            .right-panel {
                width: 100%;
            }

            .left-panel {
                padding: 50px 30px;
            }

            .left-panel h1 {
                font-size: 42px;
            }

            .left-panel .tagline {
                font-size: 18px;
            }

            .feature-list li {
                font-size: 18px;
            }

            .right-panel {
                padding: 36px 24px 42px;
            }

            h2 {
                font-size: 40px;
            }
        }

        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .left-panel {
                padding: 36px 22px;
            }

            .right-panel {
                padding: 28px 18px 34px;
            }

            .left-panel h1 {
                font-size: 34px;
            }

            .left-panel .tagline {
                font-size: 16px;
            }

            .feature-list li {
                font-size: 16px;
            }

            h2 {
                font-size: 34px;
                margin-bottom: 22px;
            }

            label {
                font-size: 16px;
            }

            input,
            select {
                height: 56px;
                font-size: 16px;
                border-radius: 12px;
            }

            button {
                height: 56px;
                font-size: 20px;
            }

            p,
            #result {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="left-panel">
        <h1>EnviroMonitor System</h1>
        <div class="tagline">Environmental Monitoring &amp; Reporting Platform</div>

        <ul class="feature-list">
            <li>Create your access account</li>
            <li>Select your role for dashboard routing</li>
            <li>Backend-ready modular flow</li>
        </ul>
    </div>

    <div class="right-panel">
        <div class="form-box">
            <div class="icon">🌿</div>
            <h2 id="title">Login</h2>

            <!-- LOGIN FORM -->
            <div id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input id="loginEmail" type="email" placeholder="Enter email address">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" placeholder="Enter password">
                </div>

                <button onclick="login()">Login</button>

                <p>
                    Don't have an account?
                    <a href="#" onclick="showRegister(); return false;">Sign up</a>
                </p>
            </div>

            <!-- REGISTER FORM -->
            <div id="registerForm" style="display:none;">
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input id="regEmail" type="email" placeholder="Create email address">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input id="regPassword" type="password" placeholder="Create password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" type="password" placeholder="Confirm password">
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role">
                        <option value="">-- Select Role --</option>
                        <option value="Monitoring Agency">Monitoring Agency</option>
                        <option value="Industry">Industry</option>
                    </select>
                </div>

                <button onclick="register()">Create Account</button>

                <p>
                    Already have an account?
                    <a href="#" onclick="showLogin(); return false;">Login</a>
                </p>
            </div>

            <h3 id="result"></h3>
        </div>
    </div>
</div>

<script>
// SWITCH FORMS
function showRegister() {
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("registerForm").style.display = "block";
    document.getElementById("title").innerText = "Sign Up";
    document.getElementById("result").innerText = "";
    document.getElementById("result").style.color = "#dc2626";
}

function showLogin() {
    document.getElementById("registerForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("title").innerText = "Login";
    document.getElementById("result").innerText = "";
    document.getElementById("result").style.color = "#dc2626";
}

// REGISTER
async function register() {
    let email = document.getElementById("regEmail").value.trim();
    let password = document.getElementById("regPassword").value.trim();
    let confirmPassword = document.getElementById("confirmPassword").value.trim();
    let role = document.getElementById("role").value;

    if (!email || !password || !confirmPassword || !role) {
        alert("Please fill all fields");
        return;
    }

    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    try {
        let res = await fetch("http://localhost:3000/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password, role })
        });

        let data = await res.json();

        if (data.error) {
            document.getElementById("result").style.color = "#dc2626";
            document.getElementById("result").innerText = data.error;
        } else {
            document.getElementById("result").style.color = "#16a34a";
            document.getElementById("result").innerText = data.message;
            alert(data.message);

            document.getElementById("regEmail").value = "";
            document.getElementById("regPassword").value = "";
            document.getElementById("confirmPassword").value = "";
            document.getElementById("role").value = "";

            showLogin();
        }
    } catch (error) {
        console.log(error);
        document.getElementById("result").style.color = "#dc2626";
        document.getElementById("result").innerText = "Server connection error";
    }
}

// LOGIN
async function login() {
    let email = document.getElementById("loginEmail").value.trim();
    let password = document.getElementById("loginPassword").value.trim();

    if (!email || !password) {
        document.getElementById("result").style.color = "#dc2626";
        document.getElementById("result").innerText = "Please enter email and password";
        return;
    }

    try {
        let res = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        let data = await res.json();

        if (data.success) {
            localStorage.setItem("userEmail", data.email);

            if (data.role === "Industry") {
                window.location.href = "industry.html";
            } else if (data.role === "Monitoring Agency") {
                window.location.href = "agency.html";
            } else {
                document.getElementById("result").style.color = "#dc2626";
                document.getElementById("result").innerText = "Unknown role";
            }
        } else {
            document.getElementById("result").style.color = "#dc2626";
            document.getElementById("result").innerText = data.error || "Invalid login";
        }
    } catch (error) {
        console.log(error);
        document.getElementById("result").style.color = "#dc2626";
        document.getElementById("result").innerText = "Server connection error";
    }
}
</script>

</body>
</html>
