<!DOCTYPE html>
<html>
<head>
    <title>Industry Profile</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1d4ed8, #06b6d4);
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 22px;
            padding: 35px 30px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .section {
            background: #f8fafc;
            border-left: 6px solid #2563eb;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        h3 {
            margin-top: 0;
            color: #1d4ed8;
            font-size: 22px;
            margin-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            background: #ffffff;
            transition: 0.2s;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        .button-wrap {
            text-align: center;
            margin-top: 10px;
        }

        button {
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35);
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px 18px;
            }

            h2 {
                font-size: 27px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏭 Industry Profile Form</h2>
    <div class="subtitle">Enter industry details, contact information, and compliance preferences</div>

    <!-- SECTION 1 -->
    <div class="section">
        <h3>Industry Details</h3>
        <div class="grid">
            <div>
                <label for="industry_name">Industry Name</label>
                <input id="industry_name" placeholder="Enter Industry Name">
            </div>

            <div>
                <label for="industry_type">Industry Type</label>
                <select id="industry_type">
                    <option value="">Select Industry Type</option>
                    <option>Manufacturing</option>
                    <option>Chemical</option>
                    <option>Cement & Construction</option>
                    <option>Steel & Metallurgy</option>
                    <option>Textile</option>
                    <option>Paper & Pulp</option>
                    <option>Pharmaceutical</option>
                    <option>Power Generation</option>
                    <option>Others</option>
                </select>
            </div>

            <div class="full-width">
                <label for="industry_id">Industry ID / Registration Number</label>
                <input id="industry_id" placeholder="Enter Industry ID / Registration Number">
            </div>

            <div class="full-width">
                <label for="address">Location / Address</label>
                <textarea id="address" placeholder="Enter full address"></textarea>
            </div>
        </div>
    </div>

    <!-- SECTION 2 -->
    <div class="section">
        <h3>Contact Information</h3>
        <div class="grid">
            <div>
                <label for="contact_name">Contact Person Name</label>
                <input id="contact_name" placeholder="Enter contact person name">
            </div>

            <div>
                <label for="role_designation">Role / Designation</label>
                <input id="role_designation" placeholder="Enter role / designation">
            </div>

            <div>
                <label for="email">Email ID</label>
                <input id="email" type="email" placeholder="Enter email address">
            </div>

            <div>
                <label for="phone">Primary Phone Number</label>
                <input id="phone" placeholder="Enter primary phone number">
            </div>

            <div class="full-width">
                <label for="alt_phone">Alternate Phone Number</label>
                <input id="alt_phone" placeholder="Enter alternate phone number">
            </div>
        </div>
    </div>

    <!-- SECTION 3 -->
    <div class="section">
        <h3>Compliance & Notifications</h3>
        <div class="grid">
            <div>
                <label for="monitoring_frequency">AQI Monitoring Frequency</label>
                <select id="monitoring_frequency">
                    <option value="">Select AQI Monitoring Frequency</option>
                    <option>Daily</option>
                    <option>Weekly</option>
                    <option>Monthly</option>
                </select>
            </div>

            <div>
                <label for="notification_pref">Notification Preference</label>
                <select id="notification_pref">
                    <option value="">Select Notification Preference</option>
                    <option>Email</option>
                    <option>SMS</option>
                    <option>Email & SMS</option>
                </select>
            </div>
        </div>
    </div>

    <div class="button-wrap">
        <button onclick="saveData()">Save Profile</button>
    </div>
</div>

<script>
async function saveData() {
    let userEmail = localStorage.getItem("userEmail");

    let data = {
        user_email: userEmail,
        industry_name: document.getElementById("industry_name").value,
        industry_type: document.getElementById("industry_type").value,
        industry_id: document.getElementById("industry_id").value,
        address: document.getElementById("address").value,
        contact_name: document.getElementById("contact_name").value,
        role_designation: document.getElementById("role_designation").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        alt_phone: document.getElementById("alt_phone").value,
        monitoring_frequency: document.getElementById("monitoring_frequency").value,
        notification_pref: document.getElementById("notification_pref").value
    };

    let res = await fetch("http://localhost:3000/save-industry", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    let result = await res.json();
    alert(result.message || result.error);
}
</script>

</body>
</html>
