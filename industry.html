<!DOCTYPE html>
<html>
<head>
    <title>Industry Profile</title>
    <link rel="stylesheet" href="industry.css">
</head>
<body>

<header class="top-navbar">
    <div class="navbar-left">EnviroMonitor – Industry Dashboard</div>
    <div class="navbar-right">
        <span class="industry-name" id="industryNameDisplay">Industry User</span>
        <button class="btn-logout" type="button" onclick="logout()">Logout</button>
    </div>
</header>

<div class="dashboard-layout">
    <aside class="sidebar">
        <ul class="nav-list">
            <li class="nav-item active" onclick="openSection('industrySection', this)">Industry Profile</li>
            <li class="nav-item" onclick="openSection('contactSection', this)">Contact Information</li>
            <li class="nav-item" onclick="openSection('complianceSection', this)">Compliance &amp; Notifications</li>
        </ul>

        <div class="progress-card">
            <div class="progress-title">Profile Completeness</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="section-card" id="industrySection">
            <h3>Industry Details</h3>

            <div class="grid">
                <div>
                    <label for="industry_name">Industry Name <span class="required">*</span></label>
                    <input id="industry_name" placeholder="e.g. Green Steel Pvt Ltd">
                </div>

                <div>
                    <label for="industry_type">Industry Type <span class="required">*</span></label>
                    <select id="industry_type">
                        <option value="">-- Select Type --</option>
                        <option>Manufacturing</option>
                        <option>Chemical</option>
                        <option>Cement & Construction</option>
                        <option>Steel & Metallurgy</option>
                        <option>Textile</option>
                        <option>Paper & Pulp</option>
                        <option>Pharmaceutical</option>
                        <option>Power Generation</option>
                        <option>Others</option>
                    </select>
                </div>

                <div>
                    <label for="industry_id">Industry ID / Registration Number <span class="required">*</span></label>
                    <input id="industry_id" placeholder="e.g. MH-IND-2024-00123">
                </div>

                <div class="full-width">
                    <label for="address">Location / Address <span class="required">*</span></label>
                    <textarea id="address" placeholder="Full address including city, state and PIN"></textarea>
                </div>
            </div>
        </div>

        <div class="section-card" id="contactSection">
            <h3>Contact Information</h3>

            <div class="grid">
                <div>
                    <label for="contact_name">Contact Person Name <span class="required">*</span></label>
                    <input id="contact_name" placeholder="e.g. Rahul Sharma">
                </div>

                <div>
                    <label for="role_designation">Role / Designation <span class="required">*</span></label>
                    <input id="role_designation" placeholder="e.g. Plant Manager">
                </div>

                <div>
                    <label for="email">Email ID <span class="required">*</span></label>
                    <input id="email" type="email" placeholder="contact@company.com">
                </div>

                <div>
                    <label for="phone">Primary Phone Number <span class="required">*</span></label>
                    <input id="phone" placeholder="+91 XXXXX XXXXX">
                </div>

                <div>
                    <label for="alt_phone">Alternate Phone Number</label>
                    <input id="alt_phone" placeholder="+91 XXXXX XXXXX">
                </div>
            </div>
        </div>

        <div class="section-card" id="complianceSection">
            <h3>Compliance &amp; Notifications</h3>

            <div class="grid">
                <div>
                    <label for="monitoring_frequency">AQI Monitoring Frequency <span class="required">*</span></label>
                    <select id="monitoring_frequency">
                        <option value="">-- Select Frequency --</option>
                        <option>Daily</option>
                        <option>Weekly</option>
                        <option>Monthly</option>
                    </select>
                </div>

                <div>
                    <label for="notification_pref">Notification Preference <span class="required">*</span></label>
                    <select id="notification_pref">
                        <option value="">-- Select Preference --</option>
                        <option>Email</option>
                        <option>SMS</option>
                        <option>Email & SMS</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="button-row">
            <button class="btn-primary" onclick="saveData()">Save Profile</button>
            <button class="btn-secondary" type="button">Submit for Review</button>
        </div>
    </main>
</div>

<script src="industry.js"></script>
</body>
</html>
