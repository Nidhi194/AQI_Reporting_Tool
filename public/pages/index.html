<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnviroMonitor - Next Gen AQI Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8Y7qWfR4+6J0JQ1hYxP2m5x2l3w9A3w==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/glass-theme.css">
    <link rel="stylesheet" href="../css/landing.css">
</head>
<body class="page-landing">

    <!-- Transition overlay for smooth navigation -->
    <div class="page-transition-overlay" id="transitionOverlay"></div>

    <main class="landing-container">
        <div class="glass-hero">
            <!-- Colorful blurred shapes behind glass -->
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            
            <div style="font-size: 3rem; color: var(--brand-600); margin-bottom: 15px;">
                <i class="fa-solid fa-leaf"></i>
            </div>
            
            <h1 class="landing-title">EnviroMonitor</h1>
            
            <p class="landing-subtitle">
                The next-generation framework for robust <strong>Air Quality Insights</strong>. <br>
                Seamlessly connecting modern industries with expert monitoring agencies for transparent, automated, and real-time compliance reporting. 
            </p>
            
            <div class="landing-actions">
                <button class="btn btn-primary btn-large" onclick="navigateToLogin()">
                    Get Started <i class="fa-solid fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        function navigateToLogin() {
            // Trigger smooth transition out
            document.body.classList.add('page-transition-active');
            
            // Wait for transition to complete before redirecting
            setTimeout(() => {
                let basePath = (window.location.protocol.startsWith('http') && window.location.pathname === '/') ? 'pages/' : '';
                window.location.href = basePath + "h.html";
            }, 600);
        }
        
        // Ensure seamless entry transition if returned via 'back' button
        window.addEventListener('pageshow', (event) => {
            if (event.persisted || document.body.classList.contains('page-transition-active')) {
                document.body.classList.remove('page-transition-active');
            }
        });
    </script>
</body>
</html>
